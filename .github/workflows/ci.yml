name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m ma2tools validate palettes/*.json
      - run: pytest -v
      - name: El plugin coincide con la paleta
        run: |
          python -m ma2tools apply palettes/default.json
          git diff --exit-code plugin/
